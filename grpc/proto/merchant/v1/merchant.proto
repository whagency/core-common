syntax = "proto3";

package merchant.v1;

option go_package = "grpc/pb/merchantv1;merchantv1";

service MerchantService {
  rpc AuthenticateMerchant (AuthenticateMerchantRequest) returns (AuthenticateMerchantResponse);
  rpc GetMerchantProfile (GetMerchantProfileRequest) returns (GetMerchantProfileResponse);
  rpc PrepareWebhookDelivery (PrepareWebhookDeliveryRequest) returns (PrepareWebhookDeliveryResponse);
}

enum OperationType {
  OPERATION_TYPE_UNSPECIFIED = 0;
  OPERATION_TYPE_PAYMENT = 1;
  OPERATION_TYPE_REFUND = 2;
  OPERATION_TYPE_PAYOUT = 3;
  OPERATION_TYPE_CHARGEBACK = 4;
}

enum FeeType {
  FEE_TYPE_UNSPECIFIED = 0;
  FEE_TYPE_PERCENT = 1;
  FEE_TYPE_FIXED = 2;
}

enum AuthResponseMode {
  AUTH_RESPONSE_MODE_UNSPECIFIED = 0;
  AUTH_RESPONSE_MODE_AUTH_ONLY = 1;
  AUTH_RESPONSE_MODE_AUTH_WITH_PROFILE = 2;
}

message FeeRule {
  OperationType operation_type = 1;
  FeeType fee_type = 2;
  string fee_value = 3;
}

message MerchantProfile {
  string merchant_id = 1;
  string merchant_code = 2;
  string display_name = 3;
  string merchant_type = 4;
  string merchant_status = 5;
  uint64 owner_user_id = 6;
  uint32 settlement_hold_days = 7;
  repeated FeeRule fee_rules = 8;
  string merchant_url = 9;
}

message AuthenticateMerchantRequest {
  string api_public_key = 1;
  int64 timestamp_ms = 2;
  string http_method = 3;
  string http_path = 4;
  bytes raw_body = 5;
  string signature = 6;
  string client_ip = 7;
  AuthResponseMode response_mode = 8;
}

message AuthenticateMerchantResponse {
  string merchant_id = 1;
  int32 mode = 2;
  bool is_enabled = 3;
  string success_url_default = 4;
  string pending_url_default = 5;
  string fail_url_default = 6;
  MerchantProfile profile = 7;
}

message GetMerchantProfileRequest {
  string merchant_id = 1;
}

message GetMerchantProfileResponse {
  string merchant_id = 1;
  string merchant_code = 2;
  string display_name = 3;
  string merchant_type = 4;
  string merchant_status = 5;
  uint64 owner_user_id = 6;
  uint32 settlement_hold_days = 7;
  repeated FeeRule fee_rules = 8;
  string merchant_url = 9;
}

message PrepareWebhookDeliveryRequest {
  string merchant_id = 1;
  int32 mode = 2;
  string webhook_id = 3;
  bytes raw_body = 4;
}

message PrepareWebhookDeliveryResponse {
  string merchant_id = 1;
  int32 mode = 2;
  bool is_enabled = 3;
  string webhook_url = 4;
  string timestamp = 5;
  string signature = 6;
}
